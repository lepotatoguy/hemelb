name: Main application
on:
  push:
    branches:
      - main
      - 'fix/**'
      - 'feature/**'
      - 'feat/**'
    paths:
      - Code/**
      - examples/**
      - dependencies/**
      # CMake modules are loaded by Code/CMakeLists.txt; the super build
      # (CMakeLists.txt) is also run end to end by install-script.yml.
      - CMake/**
      - CMakeLists.txt
      - .github/workflows/main-app.yml
      - .github/actions/**
  pull_request:
  schedule:
    # Run every Monday 0700 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:
    # Run on demand
    inputs:
      run_long_tests:
        required: true
        default: 'true'

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: RelWithDebInfo
  deps_install_prefix: ${{github.workspace}}/deps-install
  hemelb_install_prefix: ${{github.workspace}}/install
  # VMs have 2 cores, double as compilation often IO bound
  CMAKE_BUILD_PARALLEL_LEVEL: 4

jobs:
  basic-checks:
    name: Basic code quality checks

    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Check copyright statements
        run: python Scripts/checkCopyright.py

      - name: Check C++ include guards
        run: python Scripts/check_once_guards.py

  fluid_only_build:
    name: Build in fluid-only mode
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        compiler: [gnu-11, gnu-12, gnu-13]

    steps:
    - uses: actions/checkout@v5

    - uses: ./.github/actions/setup-compilers
      with:
        compiler: ${{ matrix.compiler }}

    - uses: ./.github/actions/install-hemelb-deps
      with:
        name: fluidonly

    - name: Code make build dir
      run: mkdir -p ${{github.workspace}}/build

    - name: Code configure
      run: >-
        cmake
        -S ${{github.workspace}}/Code
        -B ${{github.workspace}}/build
        -DCMAKE_BUILD_TYPE=$BUILD_TYPE
        -DCMAKE_INSTALL_PREFIX:STRING=${{env.hemelb_install_prefix}}
        -DHEMELB_DEPENDENCIES_INSTALL_PREFIX:STRING=${{env.deps_install_prefix}}
        -DHEMELB_BUILD_RBC:BOOL=OFF
        -DMPIEXEC_MAX_NUMPROCS:STRING=4

    - name: Build and install HemeLB, adding install dir to PATH
      working-directory: ${{github.workspace}}/build
      run: |
        cmake --build .
        cmake --install .
        echo "${hemelb_install_prefix}/bin" >> $GITHUB_PATH

    - name: Run main unit tests
      working-directory: ${{github.workspace}}/build
      run: tests/hemelb-tests

    - name: Store build tree on error
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: fluid-only-failed-build-tree
        path: build

    - name: Get hemelb-tests repo
      uses: ./.github/actions/get-tests-repo
      with:
        path: hemelb-tests
      env:
        GITHUB_TOKEN: ${{ github.token }}

    - name: Install python tools (required by diff test)
      working-directory: python-tools
      run: pip install .

    - name: Run the simple regression test
      working-directory: hemelb-tests/diffTest
      env:
        MPIRUN_FLAGS: --oversubscribe
        NUMPROCS: 2
        OFFSET_CHECK: light
      run: python "$GITHUB_WORKSPACE/Code/tests/upstream_regression.py" --hemelb "$(command -v hemelb)" --fixture . --mode diff

    - name: Store results on error
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: fluid-only-failed-diffTest
        path: hemelb-tests/diffTest/results

    - name: Run the checkpoint test
      working-directory: hemelb-tests/fluid-checkpoint
      env:
        MPIRUN_FLAGS: --oversubscribe
      run: python "$GITHUB_WORKSPACE/Code/tests/upstream_regression.py" --hemelb "$(command -v hemelb)" --fixture . --mode checkpoint

    - name: Restart checkpoints on different process counts
      env:
        MPIRUN_FLAGS: --oversubscribe
      run: python3 Code/tests/checkpoint_restart_mpi.py --hemelb "$(command -v hemelb)"

    - name: Store results on error
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: fluid-only-failed-checkpointTest
        path: hemelb-tests/fluid-checkpoint/results

  rbc_build:
    name: Build in RBC mode
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        compiler: [gnu-11, gnu-12, gnu-13]

    steps:
    - uses: actions/checkout@v5

    - uses: ./.github/actions/setup-compilers
      with:
        compiler: ${{ matrix.compiler }}

    - uses: ./.github/actions/install-hemelb-deps
      with:
        name: rbc
        extra_apt: libhdf5-mpi-dev
        extra_cmake: '-DHEMELB_BUILD_RBC:BOOL=ON'

    - name: Code make build dir
      run: mkdir -p ${{github.workspace}}/build

    - name: Code configure
      run: >-
        cmake
        -S ${{github.workspace}}/Code
        -B ${{github.workspace}}/build
        -DCMAKE_BUILD_TYPE=$BUILD_TYPE
        -DHEMELB_DEPENDENCIES_INSTALL_PREFIX:STRING=${{env.deps_install_prefix}}
        -DHEMELB_BUILD_RBC:BOOL=ON
        -DMPIEXEC_MAX_NUMPROCS:STRING=4

    - name: Build
      working-directory: ${{github.workspace}}/build
      run: cmake --build .

    - name: Run main unit tests
      working-directory: ${{github.workspace}}/build
      run: tests/hemelb-tests

    - name: Run parallel RBC tests
      working-directory: ${{github.workspace}}/build
      run: mpirun --oversubscribe -np 4 tests/mpi_redblood_tests

    - name: Run longer integration tests on schedule or request
      if: github.event == 'scheduled' || (github.event == 'workflow_dispatch' && inputs.run_long_tests == 'true')
      working-directory: ${{github.workspace}}/build
      run: tests/hemelb-tests [long]

    - name: Store build tree on error
      if: failure()
      uses: actions/upload-artifact@v6
      with:
        name: rbc-failed-build-tree
        path: build

  cpu_model_build:
    name: CPU model (${{ matrix.name }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: sponge, kernel: LBGKSL, wall: BFL, inlet: NASHZEROTHORDERPRESSUREIOLET, outlet: NASHZEROTHORDERPRESSUREIOLET}
          - {name: trt-sponge, kernel: TRTSL, wall: BFL, inlet: NASHZEROTHORDERPRESSUREIOLET, outlet: NASHZEROTHORDERPRESSUREIOLET}
          - {name: les-sponge, kernel: LBGKLESSL, wall: BFL, inlet: NASHZEROTHORDERPRESSUREIOLET, outlet: NASHZEROTHORDERPRESSUREIOLET}
          - {name: elastic, kernel: LBGK, wall: GZSElastic, inlet: NASHZEROTHORDERPRESSUREIOLET, outlet: NASHZEROTHORDERPRESSUREIOLET}
          - {name: yang, kernel: LBGK, wall: BFL, inlet: YANGPRESSUREIOLET, outlet: YANGPRESSUREIOLET}
          - {name: yang-corners, kernel: LBGK, wall: BFL, inlet: NASHZEROTHORDERPRESSUREIOLET, outlet: NASHZEROTHORDERPRESSUREIOLET, wall_inlet: YANGPRESSUREBFL, wall_outlet: YANGPRESSUREBFL}
          - {name: velocity, kernel: LBGK, wall: BFL, inlet: LADDIOLET, outlet: NASHZEROTHORDERPRESSUREIOLET}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-compilers
        with:
          compiler: gnu-13
      - uses: ./.github/actions/install-hemelb-deps
        with:
          name: cpu-models
      - name: Configure CPU model
        run: >-
          cmake -S Code -B build
          -DCMAKE_BUILD_TYPE=Release
          -DHEMELB_DEPENDENCIES_INSTALL_PREFIX=${{ env.deps_install_prefix }}
          -DHEMELB_BUILD_RBC=OFF -DHEMELB_BUILD_TESTS=OFF
          -DHEMELB_LATTICE=D3Q19 -DHEMELB_USE_SSE3=OFF
          -DHEMELB_KERNEL=${{ matrix.kernel }}
          -DHEMELB_WALL_BOUNDARY=${{ matrix.wall }}
          -DHEMELB_INLET_BOUNDARY=${{ matrix.inlet }}
          -DHEMELB_OUTLET_BOUNDARY=${{ matrix.outlet }}
          -DHEMELB_WALL_INLET_BOUNDARY=${{ matrix.wall_inlet || 'AUTO' }}
          -DHEMELB_WALL_OUTLET_BOUNDARY=${{ matrix.wall_outlet || 'AUTO' }}
      - name: Build CPU model
        run: cmake --build build
      - name: Check model and portable restart
        env:
          MPIRUN_FLAGS: --oversubscribe
        run: |
          if [ '${{ matrix.name }}' = velocity ]; then
            python3 Code/tests/cpu_boundary_models_mpi.py --hemelb "$PWD/build/hemelb" --model womersleyElastic
            python3 Code/tests/cpu_boundary_models_mpi.py --hemelb "$PWD/build/hemelb" --model readWrite
            python3 Code/tests/cpu_boundary_models_mpi.py --hemelb "$PWD/build/hemelb" --model weightedReadWrite
            python3 Code/tests/cpu_boundary_models_mpi.py --hemelb "$PWD/build/hemelb" --model periodicVelocity
          else
            python3 Code/tests/cpu_boundary_models_mpi.py --hemelb "$PWD/build/hemelb" --model '${{ matrix.name }}'
          fi
      - name: Compile and verify x86 vector paths
        if: matrix.name == 'yang'
        shell: bash
        run: |
          for variant in 'AVX2:avx2' 'AVX512:avx512f'; do
            macro=${variant%:*}
            flag=${variant#*:}
            c++ -std=c++20 -O2 -m"$flag" -DHEMELB_USE_"$macro" -ICode -Ibuild Code/tests/lb/simd_verification.cc -o "simd-$macro"
            status=0
            ./"simd-$macro" || status=$?
            test "$status" = 0 || test "$status" = 77
          done
