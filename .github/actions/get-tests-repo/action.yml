name: 'Get the tests repo'
description: |
  Checkout the hemelb-tests repo. If it has a branch with the same name as
  the branch being tested, use that; otherwise use main.

inputs:
  path:
    description: 'Relative path under $GITHUB_WORKSPACE to place the repository'
    required: true

runs:
  using: 'composite'
  steps:
    - id: branch
      shell: bash
      # The branch name comes from the environment and is always quoted, so a
      # pull request branch name cannot inject shell commands.
      run: |
        if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          branch="$GITHUB_HEAD_REF"
        else
          branch="$GITHUB_REF_NAME"
        fi
        if git ls-remote --exit-code --heads \
            https://github.com/hemelb-codes/hemelb-tests.git "refs/heads/$branch" > /dev/null 2>&1; then
          ans="$branch"
        else
          ans=main
        fi
        echo "Using hemelb-tests branch: $ans"
        echo "value=$ans" >> "$GITHUB_OUTPUT"

    - uses: actions/checkout@v5
      with:
        repository: hemelb-codes/hemelb-tests
        ref: ${{ steps.branch.outputs.value }}
        path: ${{ inputs.path }}
