name: 'Install the various HemeLB dependencies'

inputs:
  name:
    description: 'Name of the build type, used for caching'
    required: true

  extra_apt:
    description: 'Any extra apt packages to install (ie for RBC mode)'
    required: false
    default: ''

  extra_cmake:
    description: 'Any extra flags to pass to cmake'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Apt update
      shell: bash
      run: |
        sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
        sudo apt-get update

    - name: Install Ubuntu-provided dependencies
      shell: bash
      run: >-
        sudo
        apt-get install -y
        g++-13
        libopenmpi-dev
        libtinyxml2-dev
        libparmetis-dev
        libctemplate-dev
        ${{ inputs.extra_apt }}

    - uses: actions/cache@v5
      id: deps-cache
      with:
        path: ${{ env.deps_install_prefix }}
        key: deps-${{ inputs.name }}-${{ runner.os }}-${{ hashFiles('dependencies/**', '.github/actions/install-hemelb-deps/action.yml') }}

    - name: "Deps: make build dir"
      shell: bash
      if: steps.deps-cache.outputs.cache-hit != 'true'
      run: mkdir -p ${{ github.workspace }}/deps-build ${{ env.deps_install_prefix }}

    - name: Download Boost with retries
      shell: bash
      if: steps.deps-cache.outputs.cache-hit != 'true'
      run: |
        mkdir -p "${{ github.workspace }}/dependencies/distributions"
        cd "${{ github.workspace }}/dependencies/distributions"
        curl --http1.1 --fail --location --retry 5 --retry-all-errors \
          https://archives.boost.io/release/1.77.0/source/boost_1_77_0.tar.gz \
          --output boost_1_77_0.tar.gz
        echo '5347464af5b14ac54bb945dc68f1dd7c56f0dad7262816b956138fc53bcc0131  boost_1_77_0.tar.gz' | sha256sum --check

    - name: Deps configure
      shell: bash
      if: steps.deps-cache.outputs.cache-hit != 'true'
      run: >-
        cmake
        -S ${{ github.workspace }}/dependencies
        -B ${{ github.workspace }}/deps-build
        ${{ inputs.extra_cmake }}
        -DHEMELB_DEPENDENCIES_INSTALL_PREFIX:STRING=${{ env.deps_install_prefix }}

    - name: Deps install
      shell: bash
      if: steps.deps-cache.outputs.cache-hit != 'true'
      working-directory: ${{ github.workspace }}/deps-build
      run: cmake --build .
