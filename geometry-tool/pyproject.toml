[build-system]
# Exact versions so builds do not change as new releases appear. Each one
# supports every Python the tool supports (3.8 to 3.11); see INSTALL.
requires = [
    "setuptools==75.3.0",
    "wheel==0.45.1",
    "scikit-build==0.19.0",
    "pybind11==2.13.6",
    "cmake==3.28.3"
]
build-backend = "setuptools.build_meta"
